[package]
name = "danmaku_timeline_studio"
version = "0.4.1"
description = "Danmaku Timeline Studio desktop shell"
authors = ["Danmaku Timeline Studio Contributors"]
license = "GPL-3.0-only"
edition = "2021"
default-run = "danmaku_timeline_studio"

[lib]
name = "danmaku_timeline_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "multipart", "rustls-tls", "stream", "zstd"] }
prost = "0.13"
futures-util = "0.3"
flate2 = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "time", "macros", "sync", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup"] }
ring = "0.17"
quick-xml = "0.41"
percent-encoding = "2"
unicode-normalization = "0.1"
cookie = "0.18.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rsa = "0.9.8"
bendy = "0.6.1"
cudarc = { version = "=0.19.8", default-features = false, features = [
  "std",
  "driver",
  "cufft",
  "dynamic-loading",
  "cuda-13000",
] }
libloading = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
